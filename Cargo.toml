[workspace]
members = ["crates/core", "crates/adapters", "crates/index", "crates/transfer", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
agenthub-core = { path = "crates/core" }
agenthub-adapters = { path = "crates/adapters" }
agenthub-index = { path = "crates/index" }
agenthub-transfer = { path = "crates/transfer" }
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

